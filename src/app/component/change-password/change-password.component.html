<div class="container-fluid w-95 pb-96 pb-lg-5">
  <!-- Message for more than 5 attempts -->
  <div *ngIf="showMessage" class="alert alert-danger mt-3">
    You have exceeded the maximum number of attempts. Please contact the administrator.
    <ul>
        <li>Call: {{ '+91'+contact?.phone_no}}</li>
        <li>WhatsApp: {{ contact?.whatsapp_no }}</li>
        <li>Email: {{ contact?.gmail_id }}</li>
    </ul>
</div>


  <div class="row gx-0 gx-lg-3 mt-3" *ngIf="!showMessage">
    <div class="col-12 col-lg-9 profiles-list">
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-9">
            <div class="card custom-card p-lg-3 p-xl-4">
              <div class="card-body">
                <h4 class="card-title text-danger mb-4">Change Password </h4>

                <!-- Password Change Form -->
                <form>
                  <!-- Old Password -->
                  <div class="mb-3 row">
                    <label for="oldPassword" class="col-sm-4 col-form-label">Old Password:</label>
                    <div class="col-sm-8">
                      <input type="password" [(ngModel)]="oldPassword" class="form-control" id="oldPassword" name="oldPassword" placeholder="Enter Old Password" required>
                    </div>
                  </div>

                  <!-- New Password -->
                  <div class="mb-3 row">
                    <label for="newPassword" class="col-sm-4 col-form-label">New Password:</label>
                    <div class="col-sm-8">
                      <input type="password" [(ngModel)]="newPassword" class="form-control" id="newPassword" name="newPassword" placeholder="Enter New Password" required>
                    </div>
                  </div>

                  <!-- Confirm Password -->
                  <div class="mb-3 row">
                    <label for="confirmPassword" class="col-sm-4 col-form-label">Confirm Password:</label>
                    <div class="col-sm-8">
                      <input type="password" [(ngModel)]="confirmPassword" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Enter Confirm Password" required>
                    </div>
                  </div>

                  <!-- Submit Button -->
                  <div class="row mt-4">
                    <div class="col-sm-4">
                    </div>
                    <div class="col-sm-8">
                      <button type="submit" (click)="changepass()" class="btn btn-outline-danger">Change Password</button>
                    </div>
                  </div>
                </form>
                <!-- End Password Change Form -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
