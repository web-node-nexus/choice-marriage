<div class="container">
    
    <div class="px-4 py-3 bg-branding text-white rounded" href="#">
        <h3 class="h5 mb-0"><i class="fa-solid fa-circle-check me-2"></i>Block User List</h3>
    </div>
   
    <p-table [value]="ignoreProfileData" [resizableColumns]="true" [resizableColumns]="true" responsiveLayout="stack">
        
        <ng-template pTemplate="header" class="justify-content-center">
            <tr>
                <th>Block ID</th>
                <th>Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-profile>
            <tr class="border" style="box-shadow: 0.063rem 0 1.25rem 0 #ced0d3;">
                <td class="justify-content-center">{{profile}}</td>
                <td class="justify-content-center">
                    <button class="btn btn-success me-1 me-md-3 p-1 px-md-4 w-50"
                        [routerLink]="'/v1//member-profile/'+profile">View</button>
                    <button class="btn btn-danger me-1 me-md-3 p-1 px-md-4 w-50"
                      (click)="removeFromIgnoreList(profile)">Delete</button>
                    
                </td>
                
            </tr>
        </ng-template>

    </p-table>
    <ng-container *ngIf="ignoreProfileData.length==0">
        <app-no-data-availble></app-no-data-availble>
    </ng-container>
</div>
