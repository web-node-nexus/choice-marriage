<div class="container">

  <div class="px-4 py-3 bg-branding text-white rounded" href="#">
      <h3 class="h5 mb-0"><i class="fa-solid fa-bullhorn me-2"></i>{{ hader }}</h3>
  </div>
  <p-table [value]="contact" [resizableColumns]="true" responsiveLayout="stack"  >
      <ng-template pTemplate="header" class="justify-content-center">
          <tr>


              <th>Profile Images</th>
                <th>Profile ID</th>
              <th>Contact No</th>

              <th>Created At</th>
              <th>Action</th>

          </tr>
      </ng-template>
      <ng-template pTemplate="body" let-profile>
          <tr class="border" style="box-shadow: 0.063rem 0 1.25rem 0 #ced0d3;">

              <td class="justify-content-center">
                  <img [src]="profile.user_profile_image"  width="100" class="shadow-4" onerror="this.src='/assets/img/no_profile_picture_found.jpg'" style="border-radius: 12px;"/>
              </td>
              <td class="justify-content-center">{{profile?.viewed_profile_id}}</td>
              <td class="justify-content-center">{{ profile?.viewed_contact == 1 ? profile?.auth_phone_no : 'Contact Admin' }}</td>

              <td class="justify-content-center">{{profile?.created_At |date:'medium'}}</td>
              <td class="justify-content-center">
                  <button class="button-55 w-100 text-success" role="button">
                      <span (click)="reroute(profile?.viewed_contact,profile?.viewed_profile_id)"  *ngIf="profile?.viewed_contact == 1" >View</span>
                      <span (click)="reroute(profile?.viewed_contact,profile?.viewed_profile_id)" *ngIf="profile?.viewed_contact == 0" >View</span>
                  </button>
              </td>



          </tr>
      </ng-template>
  </p-table>
  <ng-container *ngIf="count==0">
      <p class="text-center text-danger">No Data Availble</p>
  </ng-container>
</div>
