<div class="container-fluid w-95 pb-96 pb-lg-5">
  <div class="row gx-0 gx-lg-3 mt-3">
    <!-- main layout -->
    <div class="col-12 col-lg-9 profiles-list">
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-9">
            <div class="card custom-card p-lg-3 p-xl-4">
              <div class="card-body">
                <h4 class="card-title text-danger text-center mb-3">DELETE PROFILE REQUEST TO ADMIN</h4>
                <!-- Message after request sent -->
                <div *ngIf="alertshow"  class="alert alert-success text-center mb-3" role="alert">
                  Your delete profile request has been sent successfully. Please wait for confirmation from the administrator.
                </div>
                <!-- End of message -->

                <!-- Password Change Form -->
                <form *ngIf="fromdivshow" class="text-center mt-4" (ngSubmit)="submitForm()">
                  <div class="mb-4">
                    <label for="comments" class="form-label mb-3 fw-medium">Enter Your Reason For Deleting Your Profile : *</label>
                    <textarea class="form-control" id="comments" rows="8" placeholder="Enter your reason here" [(ngModel)]="reason" name="reason" required></textarea>
                  </div>
                  <button type="submit" class="btn btn-lg btn-danger !important ed" >Request For Delete Profile</button>
                </form>
                <!-- End Password Change Form -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--end of main layout -->
  </div>
</div>
