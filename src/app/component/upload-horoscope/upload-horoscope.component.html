<div class="container-fluid w-95 pb-96 pb-lg-5">
  <div class="row gx-0 gx-lg-3 mt-3">
    <div class="col-12 col-lg-9">
      <h2 class="text-danger text-center text-uppercase mb-3">UPLOAD HOROSCOPE</h2>
      <form class="mt-4 text-center">
        <label for="uploadphoto" class="btn btn-lg btn-danger upload-btn">
          <i class="fa fa-upload"></i> UPLOAD HOROSCOPE
        </label>
        <div class="mt-3">
          <small>Note: Photo must be in .JPG, .GIF, or .PNG format, not larger than 3 MB.</small>
        </div>
        <input type="file" id="uploadphoto" style="display: none" accept="image/*,application/pdf"
          (change)="onFileSelected($event)">
        <div class="mt-3" *ngIf="selectedImage">
          <div style="margin: 12px;">
            <button class="btn btn-danger btn-custom" (click)="uplode()">
              <i class="fa fa-upload"></i> Upload
            </button>
          </div>
          <div>
            <img [src]="selectedImage" alt="Uploaded Image" class="img-fluid mb-3"
              style="max-width: 300px; max-height: 400px;">
          </div>

        </div>
        <div class="mt-3" *ngIf="uploadedImageUrl?.length != 0">
          <img [src]="file+uploadedImageUrl" alt="Uploaded Image" class="img-fluid mb-3"
            style="max-width: 300px; max-height: 400px;">
        </div>
      </form>
    </div>
  </div>
</div>
