<div class="container ">
  <div class="px-4 py-3 bg-branding text-white rounded" href="#">
    <h3 class="h5 mb-0"><i class="fa-solid fa-circle-check"></i> Shortlisted Profile</h3>
  </div>
  <p-table [value]="shortlistedProfileData" [resizableColumns]="true" responsiveLayout="stack">

    <ng-template pTemplate="header" class="justify-content-center">
      <tr>
        <th>Images</th>
        <th>#ID</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-profile>
      <tr class="border" style="box-shadow: 0.063rem 0 1.25rem 0 #ced0d3;">
        <td class="justify-content-center">
          <img [src]="imageURL+profile.shortlisted_profile_images" width="100" class="shadow-4" />
        </td>
        <td class="justify-content-center">{{profile?.shortlist_user_id}}</td>
        <td class="justify-content-center">{{profile?.created_At|date:'medium'}}</td>
        <td class="justify-content-center">

          <button class="btn btn-success me-1 me-md-3 p-1 px-md-4 w-50"
            [routerLink]="'/v1//member-profile/'+profile?.shortlist_user_id">View</button>

          <button (click)="remove(profile?.shortlist_user_id)" class="btn btn-danger me-1 me-md-3 p-1 px-md-4 w-50">Remove</button>
        </td>
      </tr>
    </ng-template>

  </p-table>
  <ng-container *ngIf="shortlistedProfileData.length==0">
    <app-no-data-availble></app-no-data-availble>
  </ng-container>
</div>
