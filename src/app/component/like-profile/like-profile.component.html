<div class="container">

    <div class="px-4 py-3 bg-branding text-white rounded" href="#">
        <h3 class="h5 mb-0"><i class="fa-solid fa-bullhorn me-2"></i>My Like Profile</h3>
    </div>
    <p-table [value]="LikeProfileList" [resizableColumns]="true" responsiveLayout="stack"  >
        <ng-template pTemplate="header" class="justify-content-center">
            <tr>


                <th>Profile Images</th>
                  <th>Profile ID</th>
                <!-- <th>Profile Name</th> -->

                <th>Created At</th>
                <th>Like / Dislike</th>

            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-profile>
            <tr class="border" style="box-shadow: 0.063rem 0 1.25rem 0 #ced0d3;">

                <td class="justify-content-center" [routerLink]="'/v1/member-profile/'+profile?.user_id">
                    <img [src]="profile.profileImageUrl"  width="100" class="shadow-4" onerror="this.src='/assets/img/no_profile_picture_found.jpg'" style="border-radius: 12px;"/>
                </td>
                <td class="justify-content-center" [routerLink]="'/v1/member-profile/'+profile?.user_id">{{profile?.user_id}}</td>
                <!-- <td class="justify-content-center">{{profile?.profile_full_name}}</td> -->

                <td class="justify-content-center" [routerLink]="'/v1/member-profile/'+profile?.user_id">{{profile?.created_At |date:'medium'}}</td>
                <td class="justify-content-center">
                    <button class="button-55 w-100" role="button">
                        <i class="fa-solid fa-lg" [ngClass]="profile?.isLiked?'fa-thumbs-up text-success':'fa-thumbs-down text-danger'"></i>
                    </button>
                </td>



            </tr>
        </ng-template>
    </p-table>
    <ng-container *ngIf="LikeProfileList.length==0">
        <p class="text-center text-danger">No Data Availble</p>
    </ng-container>
</div>
