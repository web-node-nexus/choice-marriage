<div class="banner-container containers">

    <owl-carousel-o [options]="customOptions">
        <ng-container *ngFor="let banner of bannerSlider">
            <ng-template carouselSlide>
                <img [src]="banner.image_url" class="banner img-fluidss" alt="Responsive image" >
            </ng-template>
        </ng-container>
    </owl-carousel-o>

</div>




<div *ngIf="false" id="carouselExampleCaptions" class="carousel slide carousel-fade" data-bs-ride="false">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">

        <div class="carousel-item active" *ngFor="let banner of bannerSlider">
            <img [src]="banner.image_url" class="d-block w-100" alt="...">
            <!-- <div class="carousel-caption d-none d-md-block">
                <h5>First slide label</h5>
                <p>Some representative placeholder content for the first slide.</p>
            </div> -->
        </div>
        <!-- <div class="carousel-item">
        <img src="..." class="d-block w-100" alt="...">
        <div class="carousel-caption d-none d-md-block">
          <h5>Second slide label</h5>
          <p>Some representative placeholder content for the second slide.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="..." class="d-block w-100" alt="...">
        <div class="carousel-caption d-none d-md-block">
          <h5>Third slide label</h5>
          <p>Some representative placeholder content for the third slide.</p>
        </div>
      </div> -->
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<div class="hero-image" *ngIf="false">
    <ng-container *ngxPermissionsOnly="['LOGIN_USER']">
        <div class="hero-text col-lg-4 d-flex flex-column  pt-lg-0 order-2 order-lg-1"
            style="background-color: transparent; border-radius: 15px;">
            <button *ngxPermissionsOnly="['NOTMEMBERSHIP_USER']" class="button-67 mb-2 w-100 text-danger" role="button"
                routerLink="/setup/profile">Setup
                profile</button>
            <button class="button-67 w-100 " role="button" routerLink="/search_match">Let's find your
                matches</button>
        </div>
    </ng-container>
    <ng-container>
        <div class="hero-text col-lg-4 d-flex flex-column  p-4 pt-lg-0 order-2 order-lg-1"
            style="background-color: transparent; border-radius: 15px;">
            <button class="button-67 mb-2 w-100 text-danger" role="button" routerLink="/register"
                *ngxPermissionsOnly="['GUEST_USER']">Can't wait just create
                profile</button>

        </div>
    </ng-container>
</div>
