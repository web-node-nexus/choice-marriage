<div class="container-fluid w-95 pt-4">
    <div class="row">
        <div class="col-12 col-lg-8">
            <div class="card custom-card p-4">
                <span class="mb-0 text-center">
                    Find profiles faster with id search. e.g : PataraBibaha10
                </span>
                <hr class="search-hr">
                <h5 class="mb-0 text-center">ID <span class="text-branding">Search</span></h5>
                <div class="mt-4">
                    <div class="row">
                        <div class="col-md-4 col-sm-4 col-xs-12">
                            <p class="fw-medium">Id Search<span class="text-branding">*</span> :</p>
                        </div>
                        <div class="col-md-8 col-sm-8 col-xs-12">
                            <div class="add-input">
                            <input type="text" class="form-control py-2" placeholder="Enter Matri Id" required="" name="keyword">	
                            </div>
                        </div>
                    </div>
    
                    <div class="mt-5 text-center">
                        <button type="submit" class="btn btn-lg bg-branding text-white"><i
                                class="fas fa-search"></i> Search</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="card custom-card p-3 mt-4">
                <h5 class="mb-0">Key <span class="text-branding">Search</span></h5>
                <hr class="search-hr">
                <form action="https://www.patarabibaha.com/search/search_now" method="post" class="mb-5">
                    <div class="d-flex">
                        <input type="text" class="form-control py-2" placeholder="Hindu, Muslim, Rajput, Ahmedabad, India, Software Eng, etc..." aria-label="Hindu, Muslim, Rajput, Ahmedabad, India, Software Eng, etc..." aria-describedby="key search">

                        <button type="submit" class="btn btn-sm bg-branding text-white px-3 ms-3"><i class="fas fa-search"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
